[pytest]
testpaths = tests

# tests/manual/ 是要手動執行的診斷腳本，不是單元測試 —— 裡面的檔案 import 當下
# 就會去連真實券商 API。被自動收集的話，`pytest` 會卡在登入等到逾時。
# 要跑就指名跑：python tests/manual/check_sinopac_kbars.py
norecursedirs = manual .git __pycache__ .pytest_cache

# 預設只跑快的那些，讓 `pytest` 幾秒內就有結果。
# slow 標記的測試掃的是本地實際下載的資料（data/raw/taifex 已累積上 GB 的逐筆
# ZIP），跑一次好幾分鐘。要驗證匯入流程時單獨跑：python -m pytest -m slow
addopts = -m "not slow"
markers =
    slow: 會掃描本地實際資料，耗時以分鐘計，預設不收
